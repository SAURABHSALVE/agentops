name: Checks

# Reusable: lint, type-check, test and build everything. pr.yml and deploy.yml both call it, so a change is
# held to the same bar before review and before release. No AWS credentials are used here.
on:
  workflow_call:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13" # keep equal to the Lambda runtime in infra/agentops_infra/lambda_bundling.py
  NODE_VERSION: "24"

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pytest -q # includes the DynamoDB store tests (moto), skipped only where moto cannot install

  frontend:
    name: Frontend (lint, types, static build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: frontend/out
          if-no-files-found: error
          retention-days: 7

  infra:
    name: Infra (lint, types, tests, cdk synth --strict)
    needs: frontend # synth deploys the built site as an asset; --strict rejects the missing-build warning
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: infra/requirements-dev.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: frontend/out
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pytest -q
      # Both stages, so a prod-only or dev-only mistake cannot reach main. The address is a dummy: synth only.
      # Every cdk-nag finding is an error under --strict unless it is acknowledged (with a reason) in nag.py.
      - run: npx cdk synth -c stage=dev -c alertEmail=ci@example.com --strict --quiet
      - run: npx cdk synth -c stage=prod -c alertEmail=ci@example.com --strict --quiet
