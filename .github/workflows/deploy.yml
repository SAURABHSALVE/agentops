name: Deploy

# Every push to main: run the same checks as a pull request, then deploy production and smoke-test it.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_iam_changes:
        description: "Let this run apply IAM-broadening changes (new roles or wider permissions). Off by default."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false # never interrupt a deploy half way; the next one waits its turn

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  aws-not-enabled:
    name: AWS jobs are off (production deploy)
    # Visible on purpose: a skipped AWS job must never be mistaken for a passing one.
    if: vars.AWS_DEPLOY_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo "::notice title=AWS jobs are off::production deploy did not run because the repository variable AWS_DEPLOY_ENABLED is not 'true'. The real checks above still ran. See README, 'Turning AWS deploys on'."
          {
            echo '### AWS jobs are off'
            echo 'The production deploy did **not** run: `AWS_DEPLOY_ENABLED` is not `true`.'
            echo 'The lint, type, test and build checks above are unaffected and still gate this change.'
            echo 'To turn it on: update the OIDC stack, then set the variable (README, "Turning AWS deploys on").'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy production
    needs: checks
    # Off until the account's OIDC roles trust this repository; set AWS_DEPLOY_ENABLED=true to turn it on (README).
    if: vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write # the deploy role trusts only runs on refs/heads/main of this repository
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: infra/requirements-dev.txt
      # The exact site build that just passed the checks, not a rebuild.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: frontend/out
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: agentops-deploy-${{ github.run_id }}
      - name: cdk deploy
        env:
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          # "mock" (offline, free) unless the repository variable AGENT_PROVIDER is "openai"; see README,
          # "Turning the live AI on". Live mode also needs the OpenAI key in Secrets Manager and a manual deploy.
          AGENT_PROVIDER: ${{ vars.AGENT_PROVIDER || 'mock' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          # `broadening` makes the deploy fail (not prompt) if IAM or network access would widen, so a pipeline
          # cannot silently grant itself more. Re-run manually with the input above after reviewing the change.
          APPROVAL: ${{ inputs.allow_iam_changes && 'never' || 'broadening' }}
        run: |
          echo "::add-mask::$ALERT_EMAIL"
          npx cdk deploy 'AgentOps-prod-*' -c stage=prod -c "alertEmail=$ALERT_EMAIL" \
            -c "agentProvider=$AGENT_PROVIDER" -c "openaiModel=$OPENAI_MODEL" \
            --require-approval "$APPROVAL" --outputs-file ../cdk-outputs.json --progress events
      - name: Smoke test the live site
        working-directory: .
        run: |
          SITE_URL="$(python3 -c "import json; print(json.load(open('cdk-outputs.json'))['AgentOps-prod-Frontend']['SiteUrl'])")"
          scripts/smoke_test.sh "$SITE_URL"
          echo "Live: $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
