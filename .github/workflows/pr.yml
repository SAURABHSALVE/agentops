name: Pull request

# Everything that must pass before merge, plus a read-only `cdk diff` of what would change in production.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true # a newer push makes the older run pointless

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  diff:
    name: cdk diff (production, read-only)
    needs: checks
    # Pull requests from forks get no OIDC token (and must not get one), so only same-repo branches diff.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write # request the OIDC token; the role below trusts only `pull_request` runs of this repo
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: infra/requirements-dev.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: frontend/out
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DIFF_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: agentops-pr-diff
      - name: cdk diff
        env:
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        run: |
          echo "::add-mask::$ALERT_EMAIL" # repository variables are not masked in logs by default
          # --no-change-set: compare templates only, which the read-only role can do. A change set needs deploy rights.
          npx cdk diff 'AgentOps-prod-*' -c stage=prod -c "alertEmail=$ALERT_EMAIL" --no-change-set 2>&1 | tee diff.txt
          {
            echo '### cdk diff (production)'
            echo '```'
            tail -c 60000 diff.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
